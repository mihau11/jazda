name: Wygeneruj keystore (jednorazowo)

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Alias klucza'
        default: 'monowidget'
      validity_days:
        description: 'Waznosc w dniach'
        default: '10000'

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generuj keystore i haslo
        run: |
          PASS="$(openssl rand -base64 24 | tr -d '\n/+=' | head -c 24)"
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias "${{ inputs.alias }}" \
            -keyalg RSA -keysize 2048 \
            -validity "${{ inputs.validity_days }}" \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Mono Widget, OU=Personal, O=Personal, L=Unknown, S=Unknown, C=PL"
          mkdir -p out
          base64 -w0 release.jks > out/SIGNING_KEYSTORE_B64.txt
          printf '%s' "$PASS" > out/SIGNING_STORE_PASSWORD.txt
          printf '%s' "$PASS" > out/SIGNING_KEY_PASSWORD.txt
          printf '%s' "${{ inputs.alias }}" > out/SIGNING_KEY_ALIAS.txt
          echo "Gotowe. Pobierz artefakt i wklej kazdy plik jako sekret repo o tej samej nazwie."

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-secrets
          path: out/
          retention-days: 1
